const SRC=`import os

from fastapi import FastAPI, HTTPException
from fastapi.middleware.cors import CORSMiddleware
from pydantic import BaseModel
from dotenv import load_dotenv
from supabase import create_client

load_dotenv()

# 로컬에선 .env를 읽고, Railway에선 Variables가 이미 들어 있음
SUPABASE_URL = os.environ["SUPABASE_URL"]
SUPABASE_SECRET_KEY = os.environ["SUPABASE_SECRET_KEY"]
FRONT_ORIGINS = [
    o.strip() for o in os.getenv("FRONT_ORIGINS", "").split(",") if o.strip()
]

sb = create_client(SUPABASE_URL, SUPABASE_SECRET_KEY)

app = FastAPI(title="my-api")

app.add_middleware(
    CORSMiddleware,
    allow_origins=FRONT_ORIGINS,
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)


class Spot(BaseModel):
    id: int
    name: str
    category: str
    emoji: str | None = None
    color: str | None = None
    description: str | None = None
    location: str | None = None


@app.get("/health")
def health():
    return {"status": "ok"}


@app.get("/spots", response_model=list[Spot])
def list_spots(category: str | None = None):
    try:
        q = sb.table("spots").select("*").order("id")
        if category:
            q = q.eq("category", category)
        return q.execute().data
    except Exception as e:
        raise HTTPException(status_code=502, detail=f"Supabase error: {e}")


@app.get("/spots/{spot_id}", response_model=Spot)
def get_spot(spot_id: int):
    try:
        res = sb.table("spots").select("*").eq("id", spot_id).limit(1).execute()
    except Exception as e:
        raise HTTPException(status_code=502, detail=f"Supabase error: {e}")
    if not res.data:
        raise HTTPException(status_code=404, detail="Spot not found")
    return res.data[0]`.split('\n');

/* ---------- 엔진 ---------- */
const $=id=>document.getElementById(id);
let scene='code',cur=0,playing=true,timer=null;

function build(){
  const S=SCENES[scene];cur=0;
  if(S.type==='code'){
    $('card').innerHTML='<span class="phase" id="phase"></span><div class="split"><div class="code" id="code"></div><div class="side"><div class="cap" id="cap"></div><div class="mem" id="mem"></div></div></div>';
    $('code').innerHTML=SRC.map((l,i)=>'<div class="ln'+(l.trim().startsWith('#')?' cm':'')+'" data-n="'+(i+1)+'"><i>'+(i+1)+'</i>'+l.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>').join('');
  }else{
    const n=S.nodes.length;
    $('card').innerHTML='<div class="stage" id="stage" style="grid-template-columns:repeat('+n+',1fr)"><div class="track" style="left:'+(50/n)+'%;right:'+(50/n)+'%"></div><div class="packet" id="packet"></div>'+
      S.nodes.map((x,i)=>'<div class="node" id="nd'+i+'"><div class="ic">'+x.ic+'</div><div class="nm">'+x.nm+'</div><div class="sub">'+x.sub+'</div></div>').join('')+
      '</div><div class="cap flowcap" id="cap"></div>';
  }
  $('dots').innerHTML=S.steps.map((_,i)=>'<i data-i="'+i+'"></i>').join('');
  [...$('dots').children].forEach(d=>d.onclick=()=>{show(+d.dataset.i);tick()});
  show(0);tick();
}

function show(i){
  const S=SCENES[scene];cur=(i+S.steps.length)%S.steps.length;const s=S.steps[cur];
  $('cap').innerHTML='<div class="t">'+s.t+'</div><p>'+s.p+'</p>';
  if(S.type==='code'){
    const ph=$('phase');ph.textContent=s.phase;ph.classList.toggle('req',s.ph==='req');
    $('mem').innerHTML='<b>📋 지금 메모리 상태</b>'+s.m.map(x=>'<div>'+x+'</div>').join('');
    // r: [from,to] 연속 구간, 길이 4 이상이면 개별 줄 목록 취급
    const set=new Set();
    if(s.r.length===2){for(let k=s.r[0];k<=s.r[1];k++)set.add(k)}
    else if(s.id===undefined){ // 쌍(시작,끝)의 나열
      for(let k=0;k<s.r.length;k+=2){const a=s.r[k],b=s.r[k+1]??a;for(let x=a;x<=b;x++)set.add(x)}
    }
    document.querySelectorAll('.ln').forEach(el=>{const on=set.has(+el.dataset.n);el.classList.toggle('hl',on);el.classList.toggle('dim',!on)});
    const first=document.querySelector('.ln.hl'),box=$('code');
    if(first)box.scrollTo({top:first.offsetTop-box.offsetTop-60,behavior:'smooth'});
  }else{
    S.nodes.forEach((_,k)=>$('nd'+k).classList.toggle('active',k===s.a));
    const n=S.nodes.length,p=$('packet');
    p.style.left=(100/n*s.to+50/n)+'%';p.textContent=s.ic;p.classList.toggle('back',!!s.back);
  }
  [...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k===cur));
  $('cnt').textContent=(cur+1)+' / '+S.steps.length;
}
function tick(){clearInterval(timer);if(playing)timer=setInterval(()=>show(cur+1),5500)}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  scene=b.dataset.s;build();
});
$('bNext').onclick=()=>{show(cur+1);tick()};$('bPrev').onclick=()=>{show(cur-1);tick()};
$('bPlay').onclick=()=>{playing=!playing;$('bPlay').textContent=playing?'⏸ 멈춤':'▶ 재생';tick()};
build();
</script>
