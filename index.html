<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지금 지구의 지진</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        html, body { margin: 0; height: 100%; background: #0b0f1a; color: #e8ecf5; font-family: sans-serif; }
        #map { position: absolute; inset: 0; background: #0b0f1a; }
        .panel { position: absolute; z-index: 1000; background: rgba(11,15,26,.85); backdrop-filter: blur(6px);
                 border: 1px solid #2a3350; border-radius: 12px; padding: 12px 14px; }
        #top { top: 12px; left: 12px; width: 260px; }
        #top h1 { margin: 0 0 8px; font-size: 18px; }
        #top label { display: block; margin-top: 8px; font-size: 13px; color: #9aa6c4; }
        #top select, #top input { width: 100%; margin-top: 4px; }
        #stat { margin-top: 10px; font-size: 13px; }
        #list { bottom: 12px; right: 12px; width: 300px; max-height: 40vh; overflow: auto; font-size: 13px; }
        #list h2 { margin: 0 0 6px; font-size: 14px; }
        #list div { padding: 5px 0; border-top: 1px solid #1f2742; cursor: pointer; }
        #list b { color: #ff6b4a; }
        .pulse { animation: pulse 1.6s ease-out infinite; transform-origin: center; transform-box: fill-box; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
        @media (max-width: 640px) { #list { display: none; } }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="top" class="panel">
        <h1>🌍 지금 지구의 지진</h1>
        <label>기간
            <select id="period">
                <option value="all_hour">지난 1시간</option>
                <option value="all_day" selected>지난 24시간</option>
                <option value="2.5_week">지난 7일 (규모 2.5↑)</option>
            </select>
        </label>
        <label>최소 규모 <span id="minv">0</span>
            <input id="min" type="range" min="0" max="7" step="0.5" value="0">
        </label>
        <div id="stat">불러오는 중…</div>
        <div style="margin-top:6px;font-size:11px;color:#6b7799">데이터: USGS · 1분마다 갱신</div>
    </div>
    <div id="list" class="panel"><h2>가장 큰 지진 TOP 10</h2><div id="rows"></div></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const FEED = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/"
        const map = L.map("map", { worldCopyJump: true, minZoom: 2 }).setView([20, 130], 3)
        L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
            { attribution: "© OpenStreetMap © CARTO", subdomains: "abcd" }).addTo(map)
        const layer = L.layerGroup().addTo(map)
        let quakes = []

        const color = depth => depth < 70 ? "#ff6b4a" : depth < 300 ? "#ffc24a" : "#4ac8ff"   // 얕을수록 붉게
        const ago = t => {
            const m = Math.round((Date.now() - t) / 60000)
            return m < 60 ? `${m}분 전` : m < 1440 ? `${Math.round(m / 60)}시간 전` : `${Math.round(m / 1440)}일 전`
        }

        function draw() {
            const min = +document.getElementById("min").value
            document.getElementById("minv").textContent = min
            layer.clearLayers()
            const shown = quakes.filter(q => (q.properties.mag ?? 0) >= min)
            for (const q of shown) {
                const [lon, lat, depth] = q.geometry.coordinates
                const mag = q.properties.mag ?? 0
                const c = color(depth)
                const recent = Date.now() - q.properties.time < 3600000
                const label = `<b>M${mag.toFixed(1)}</b> ${q.properties.place}<br>${ago(q.properties.time)} · 깊이 ${Math.round(depth)}km<br><a href="${q.properties.url}" target="_blank">상세 보기</a>`
                if (recent) L.circleMarker([lat, lon], { radius: 4 + mag * 3, color: c, weight: 2, fill: false, className: "pulse" }).addTo(layer)
                L.circleMarker([lat, lon], { radius: 2 + mag * 2.5, color: c, weight: 1, fillColor: c, fillOpacity: .45 })
                    .addTo(layer).bindPopup(label)
            }
            document.getElementById("stat").textContent = `${shown.length}건 표시 (전체 ${quakes.length}건)`
            const top = [...shown].sort((a, b) => b.properties.mag - a.properties.mag).slice(0, 10)
            const rows = document.getElementById("rows")
            rows.innerHTML = ""
            for (const q of top) {
                const d = document.createElement("div")
                d.innerHTML = `<b>M${q.properties.mag.toFixed(1)}</b> ${q.properties.place}<br><small>${ago(q.properties.time)}</small>`
                d.onclick = () => map.flyTo([q.geometry.coordinates[1], q.geometry.coordinates[0]], 6)
                rows.appendChild(d)
            }
        }

        async function load() {
            try {
                const r = await fetch(FEED + document.getElementById("period").value + ".geojson")
                quakes = (await r.json()).features
                draw()
            } catch (e) {
                document.getElementById("stat").textContent = "데이터를 가져오지 못했어요"
            }
        }

        document.getElementById("period").onchange = load
        document.getElementById("min").oninput = draw
        load()
        setInterval(load, 60000)
    </script>
</body>
</html>
